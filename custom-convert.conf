# SoundCloud convert hls m3u8
soundcloud mp3 * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -f wav - | [lame] --silent -q $QUALITY$ $BITRATE$ - -

soundcloud pcm * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -f s16le -

soundcloud flc * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -f flac -

# --- TEACHING EXAMPLE: conditional routing for Go+ tracks ---
# These rules are reached only when ProtocolHandler::_formatForTrack() tags a
# track 'sc_goplus' (i.e. it is a Go+/subscription track). They are identical to
# the plain soundcloud rules above, except they add a benign -metadata tag so you
# can SEE the conditional routing take effect in the ffmpeg command (visible in
# the LMS log at debug, or bump -loglevel off 'quiet'). This does NOT decrypt
# anything — it just proves the source-format branch changes the command line.
sc_goplus mp3 * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -metadata comment=SoundCloud-GoPlus -f wav - | [lame] --silent -q $QUALITY$ $BITRATE$ - -

sc_goplus pcm * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -metadata comment=SoundCloud-GoPlus -f s16le -

sc_goplus flc * *
        # RB:{BITRATE=-B %B}T:{START=-ss %s}
        [ffmpeg] -loglevel quiet -i $URL$ $START$ -metadata comment=SoundCloud-GoPlus -f flac -

# --- TEACHING EXAMPLE: wrapper script that carries a per-track value to ffmpeg ---
# These rules are reached only when _formatForTrack() tags a track 'sc_demo',
# which happens when the 'demoGainDb' plugin pref is non-zero. Instead of calling
# ffmpeg directly, they call bin/scwrap.pl, passing the desired output format and
# $URL$. The plugin appends '#scgain=<db>' to the stream URL; the wrapper reads it
# out of the fragment, strips it, and execs ffmpeg with a matching '-af volume'
# filter. This is the general pattern for passing a value that has NO built-in
# placeholder: stash it on the URL, unpack it in a wrapper. Purely benign — it
# only changes playback volume.
#
# @PLUGINDIR@ is rewritten to the real plugin directory by
# Plugin::_fixupConvertPaths() at init (custom-convert.conf can't know its own
# absolute path). Note there is no $START$ here: the wrapper example keeps the
# command minimal; seek support would be threaded through as an extra arg.
sc_demo mp3 * *
        #
        [perl] "@PLUGINDIR@/bin/scwrap.pl" wav $URL$ | [lame] --silent -q $QUALITY$ - -

sc_demo pcm * *
        #
        [perl] "@PLUGINDIR@/bin/scwrap.pl" s16le $URL$

sc_demo flc * *
        #
        [perl] "@PLUGINDIR@/bin/scwrap.pl" flac $URL$
